<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Last Man Standing — hourly lap tracker</title>
    <meta
      name="description"
      content="A countdown, a lap button, shoe mileage and your standing totals — works offline."
    />
    <meta name="theme-color" content="#0B0B0E" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Man" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="wordmark" aria-label="Last man standing">Last man<span aria-hidden="true">Standing</span></h1>
        <div class="topbar-actions">
          <button class="edit" id="editStart" type="button" aria-label="Edit start time">Edit</button>
          <button class="tapout" id="tapout" type="button" hidden>Tap out</button>
        </div>
      </header>

      <section class="hero" id="hero" aria-label="Countdown">
        <span class="hero-label" id="heroLabel">Starts in</span>
        <div class="clock" id="clock" role="timer">00:00:00</div>
        <div class="hero-sub" id="heroSub">Sat 28 Nov · 5:00 am</div>
        <div class="track" aria-hidden="true"><div class="track-fill" id="trackFill"></div></div>
      </section>

      <button class="lap" id="lap" type="button">Finish lap <span class="lap-add">+3 mi</span></button>

      <button class="shoe" id="shoePill" type="button">
        <span class="shoe-text">
          <span class="shoe-kicker" id="shoeKicker">On your feet</span>
          <span class="shoe-name" id="shoeName">Add a pair</span>
          <span class="shoe-meta" id="shoeMeta">Track mileage per pair</span>
        </span>
        <span class="shoe-chev" aria-hidden="true">›</span>
      </button>

      <section class="stats" aria-label="Totals">
        <div class="stat stat--distance">
          <span class="stat-label">Distance</span>
          <strong class="stat-num" id="statDistance">0.0<span class="unit">mi</span></strong>
        </div>
        <div class="stat stat--run">
          <span class="stat-label">Run time</span>
          <strong class="stat-num" id="statRun">0m</strong>
        </div>
        <div class="stat stat--total">
          <span class="stat-label">Total time</span>
          <strong class="stat-num" id="statTotal">0m</strong>
        </div>
      </section>

      <section class="rail-wrap" id="railWrap" aria-label="Hour by hour" hidden>
        <div class="rail-head"><span>Hour by hour</span><span id="railCount">0 laps</span></div>
        <div class="rail" id="rail"></div>
      </section>

      <footer class="foot">Go One More</footer>
    </main>

    <div class="alarm" id="alarm" role="alert" hidden>
      <span class="alarm-text">
        <span class="alarm-title">3 minutes to the hour</span>
        <span class="alarm-sub" id="alarmSub"></span>
      </span>
      <button class="alarm-btn" id="alarmDisarm" type="button">Disarm</button>
    </div>

    <div class="scrim" id="scrim" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h2 id="sheetTitle"></h2>
        <p id="sheetBody"></p>
        <div class="sheet-content" id="sheetContent"></div>
        <div class="sheet-actions" id="sheetActions"></div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
